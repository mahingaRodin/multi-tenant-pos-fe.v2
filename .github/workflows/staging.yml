name: Staging CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""
